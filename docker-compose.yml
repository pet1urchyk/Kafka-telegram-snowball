services:
    controller-1:
        image: apache/kafka:4.3.1
        hostname: controller-1
        environment:
            KAFKA_NODE_ID: 1
            KAFKA_PROCESS_ROLES: "controller"
            KAFKA_LISTENERS: "CONTROLLER://0.0.0.0:9093"
            KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT" 
            KAFKA_CONTROLLER_QUORUM_VOTERS: "1@controller-1:9093,3@controller-2:9093,5@controller-3:9093"
            CLUSTER_ID: "cA6SnwySRveTR8Tu4jJleg"
    broker-1:
        image: apache/kafka:4.3.1
        hostname: broker-1
        ports:
          - "19092:19092"
        environment:
            KAFKA_NODE_ID: 2
            KAFKA_PROCESS_ROLES: "broker"
            KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:19092"
            KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://broker-1:9092,PLAINTEXT_HOST://localhost:19092"
            KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT, CONTROLLER:PLAINTEXT, PLAINTEXT_HOST:PLAINTEXT"
            KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
            KAFKA_MIN_INSYNC_REPLICAS: 2
            KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
            KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
            KAFKA_NUM_PARTITIONS: 3
            KAFKA_DEFAULT_REPLICATION_FACTOR: 3
            KAFKA_CONTROLLER_QUORUM_VOTERS: "1@controller-1:9093,3@controller-2:9093,5@controller-3:9093"
            CLUSTER_ID: "cA6SnwySRveTR8Tu4jJleg"
